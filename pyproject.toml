[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cdtab"
version = "1.0.0"
description = "Exact constraint-aware native-token tabular generation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "torch==2.8.0",
  "transformers==4.55.4",
  "tokenizers==0.21.4",
  "be-great==0.0.11",
  "datasets==3.2.0",
  "accelerate==1.10.1",
  "numpy==2.2.5",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "scikit-learn==1.6.1",
  "huggingface-hub==0.36.2",
  "safetensors==0.8.0",
  "fsspec==2024.9.0",
  "pyarrow==25.0.1",
  "tqdm==4.67.1",
  "psutil==7.0.0",
  "aiohappyeyeballs==2.7.1",
  "aiohttp==3.14.5",
  "aiosignal==1.4.0",
  "attrs==26.1.0",
  "certifi==2026.10.23",
  "charset-normalizer==3.5.2",
  "cloudpickle==3.1.2",
  "colorama==0.4.6",
  "dill==0.3.8",
  "filelock==4.2.4",
  "frozenlist==1.8.0",
  "idna==3.20",
  "jinja2==3.1.6",
  "joblib==1.6.0",
  "markupsafe==3.0.3",
  "mpmath==1.3.0",
  "multidict==7.2.1",
  "multiprocess==0.70.16",
  "networkx==3.6.1",
  "packaging==26.3",
  "propcache==0.5.4",
  "python-dateutil==4.0.0",
  "pytz==2026.6",
  "pyyaml==6.0.3",
  "regex==2026.11.9",
  "requests==2.34.2",
  "sympy==1.14.0",
  "threadpoolctl==3.8.0",
  "typing-extensions==4.16.0",
  "tzdata==2026.6",
  "urllib3==2.8.0",
  "xxhash==4.1.0",
  "yarl==1.25.1",
]

[tool.setuptools.packages.find]
where = ["src"]
