[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cdtab"
version = "1.0.0"
description = "Exact constraint-aware native-token tabular generation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "torch==2.8.0",
  "transformers==4.55.4",
  "tokenizers==0.21.4",
  "be-great==0.0.11",
  "datasets==3.2.0",
  "accelerate==1.10.1",
  "numpy==2.2.5",
  "pandas==2.2.3",
  "huggingface-hub==0.36.2",
  "psutil==7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
